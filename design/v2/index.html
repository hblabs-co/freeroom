<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freeroom v2 mockup</title>
<meta name="description" content="Freeroom v2: visual, icon-first redesign of the macOS menu-bar disk cleaner by hblabs. Clickable high-fidelity mockup.">
<style>
/* ==========================================================================
   Freeroom v2 — tokens
   hblabs DS: one blue accent (#1a4ddb / #6594fa), amber = agent only,
   semantic colour always paired with a glyph, glass only on floating chrome.
   Values mirror Sources/FreeroomApp/Theme.swift so the mock and the app match.
   ========================================================================== */
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
  --mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, monospace;

  --ink-0: #fbfcfd; --ink-1: #f4f6f9; --ink-2: #eaedf2; --ink-3: #d9dde4;
  --ink-4: #b3b9c4; --ink-5: #5d6472; --ink-6: #3a404c; --ink-7: #1a1d24;
  --line: rgba(20,24,33,.10); --line-strong: rgba(20,24,33,.17); --line-soft: rgba(20,24,33,.06);

  --accent: #1a4ddb; --accent-hover: #1640c0; --accent-soft: #e5ecfc; --on-accent: #ffffff; --accent-ring: rgba(26,77,219,.35);
  --agent: #a86a0e; --agent-fill: #c89638; --agent-soft: #fdf0dc; --agent-line: rgba(200,150,56,.45);
  --safe: #1f7a47;   --safe-soft: #e3f3e9;   --safe-tile: #eef8f1;
  --review: #0e6f84; --review-soft: #ddf0f4; --review-tile: #ecf6f9;
  --keep: #5f5f66;   --keep-soft: #ececef;
  --danger: #b42318; --danger-soft: #fde8e6;

  --desk-a: #c9d8f6; --desk-b: #e6ecf8; --desk-c: #b9d6ea; --desk-d: #dcd6f3;
  --win: rgba(246,247,250,.80);        /* window frame glass */
  --side: rgba(240,243,248,.62);       /* sidebar glass */
  --pane: #fdfdfe;                     /* opaque reading surface */
  --card: #ffffff;
  --glass: rgba(250,251,253,.66); --glass-strong: rgba(250,251,253,.84);
  --glass-rim: rgba(255,255,255,.75); --glass-edge: rgba(20,24,33,.10);
  --spec: rgba(255,255,255,.9);
  --tile-brand: #ffffff; --tile-sym: #eef1f5; --tile-app-a: #f7f8fa; --tile-app-b: #e3e7ee;
  --shadow-win: 0 0 0 .5px rgba(0,0,0,.18), 0 22px 70px rgba(15,22,40,.28), 0 6px 18px rgba(15,22,40,.12);
  --shadow-pop: 0 0 0 .5px rgba(0,0,0,.12), 0 18px 50px rgba(15,22,40,.25);
  --bar-track: #e4e8ee;
  --other: #c4cad4;
}
html[data-theme="dark"] {
  --ink-0: #0b0e14; --ink-1: #12161e; --ink-2: #1a1f29; --ink-3: #262c38;
  --ink-4: #6b7281; --ink-5: #9ba2ae; --ink-6: #c5cad3; --ink-7: #eceef2;
  --line: rgba(255,255,255,.09); --line-strong: rgba(255,255,255,.16); --line-soft: rgba(255,255,255,.05);

  --accent: #6594fa; --accent-hover: #7aa3fb; --accent-soft: #1b2847; --on-accent: #070d1a; --accent-ring: rgba(101,148,250,.4);
  --agent: #f0b54a; --agent-fill: #f0b54a; --agent-soft: #3a2c14; --agent-line: rgba(240,181,74,.45);
  --safe: #5fd394;   --safe-soft: #173426;   --safe-tile: #14271e;
  --review: #5cc8de; --review-soft: #13313a;  --review-tile: #12252c;
  --keep: #a0a0a8;   --keep-soft: #26272c;
  --danger: #ff8a80; --danger-soft: #3d1b18;

  --desk-a: #0f1d3d; --desk-b: #0a0f1c; --desk-c: #0c2a3a; --desk-d: #1c1838;
  --win: rgba(28,32,41,.78);
  --side: rgba(30,35,46,.55);
  --pane: #15191f;
  --card: #1b2028;
  --glass: rgba(34,39,50,.62); --glass-strong: rgba(34,39,50,.86);
  --glass-rim: rgba(255,255,255,.14); --glass-edge: rgba(0,0,0,.4);
  --spec: rgba(255,255,255,.16);
  --tile-brand: #222833; --tile-sym: #222833; --tile-app-a: #2c323e; --tile-app-b: #1c2129;
  --shadow-win: 0 0 0 .5px rgba(255,255,255,.12), 0 22px 70px rgba(0,0,0,.6), 0 6px 18px rgba(0,0,0,.35);
  --shadow-pop: 0 0 0 .5px rgba(255,255,255,.12), 0 18px 50px rgba(0,0,0,.55);
  --bar-track: #262c37;
  --other: #4a5160;
  --glyph-on: #0b0e14;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.38 var(--font); color: var(--ink-7); background: var(--ink-0); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
input { font: inherit; color: inherit; }
.mono, .num { font-family: var(--mono); font-feature-settings: "tnum"; font-variant-numeric: tabular-nums; }
.i { width: 16px; height: 16px; flex: none; display: inline-block; vertical-align: middle; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--ink-5); }
.appic .d { display: none; } html[data-theme="dark"] .appic .l { display: none; } html[data-theme="dark"] .appic .d { display: inline; }

/* ---------- Desktop ---------- */
.desk { position: fixed; inset: 0; background:
  radial-gradient(900px 600px at 15% 10%, var(--desk-a), transparent 65%),
  radial-gradient(800px 700px at 90% 25%, var(--desk-d), transparent 60%),
  radial-gradient(900px 700px at 55% 110%, var(--desk-c), transparent 60%),
  var(--desk-b); }
.mbar { position: fixed; top: 0; left: 0; right: 0; height: 28px; z-index: 50; display: flex; align-items: center; gap: 18px; padding: 0 14px;
  background: rgba(255,255,255,.28); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8); font-size: 13px; }
html[data-theme="dark"] .mbar { background: rgba(10,12,18,.32); }
.mbar b { font-weight: 700; }
.mbar .r { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.mbar .fr { display: flex; align-items: center; gap: 5px; padding: 2px 7px; border-radius: 6px; }
.mbar .fr.on { background: rgba(0,0,0,.12); } html[data-theme="dark"] .mbar .fr.on { background: rgba(255,255,255,.18); }
.mbar .fr svg { width: 17px; height: 17px; }
.mbar .fr span { font-variant-numeric: tabular-nums; }
.stage { position: relative; z-index: 1; min-height: 100vh; padding: 52px 24px 110px; display: flex; justify-content: center; align-items: flex-start; }

/* ---------- Glass ---------- */
.glass { background: var(--glass); backdrop-filter: blur(30px) saturate(1.7); -webkit-backdrop-filter: blur(30px) saturate(1.7);
  border: .5px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--spec), inset 0 0 0 .5px var(--glass-rim); }

/* ---------- Icon tiles (app / brand / symbol) ---------- */
.ai { --s: 28px; position: relative; width: var(--s); height: var(--s); flex: none; border-radius: calc(var(--s) * .235); display: inline-grid; place-items: center; overflow: hidden; }
.ai.app { background: linear-gradient(180deg, var(--tile-app-a), var(--tile-app-b)); box-shadow: inset 0 0 0 .5px var(--line-strong), 0 .5px 1.5px rgba(0,0,0,.12); }
.ai.app span { font-weight: 650; color: var(--ink-5); letter-spacing: -.01em; text-align: center; line-height: 1.05; padding: 0 3px; font-size: calc(var(--s) * .3); }
.ai.app.big span { font-size: calc(var(--s) * .17); }
.ai.brand { background: var(--tile-brand); box-shadow: inset 0 0 0 .5px var(--line-strong), 0 .5px 1.5px rgba(0,0,0,.10); }
.ai.brand i { width: 60%; height: 60%; background: var(--bc, var(--ink-7)); -webkit-mask: var(--m) center/contain no-repeat; mask: var(--m) center/contain no-repeat; display: none; }
.ai.brand.ok i { display: block; } .ai.brand.ok b { display: none; }
.ai.brand b { font-size: calc(var(--s) * .38); color: var(--ink-5); }
.ai.sym { background: var(--tile-sym); box-shadow: inset 0 0 0 .5px var(--line); color: var(--ink-6); }
.ai.sym svg { width: 58%; height: 58%; }
.ai.fr { background: none; box-shadow: none; overflow: visible; } .ai.fr svg { width: 100%; height: 100%; }
body.srcs .ai[data-src]::after { content: attr(data-src); position: absolute; left: 50%; bottom: -1px; transform: translateX(-50%); font: 700 7.5px/1 var(--mono); letter-spacing: .03em;
  padding: 2px 3px; border-radius: 3px; background: var(--ink-7); color: var(--ink-0); text-transform: uppercase; }

/* ---------- Chips ---------- */
.chip { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px 0 5px; border-radius: 10px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.chip .i { width: 13px; height: 13px; }
.chip.safe { color: var(--safe); background: var(--safe-soft); }
.chip.review { color: var(--review); background: var(--review-soft); }
.chip.keep { color: var(--keep); background: var(--keep-soft); }
.chip.agent { color: var(--agent); background: var(--agent-soft); }
.chip.neutral { color: var(--ink-5); background: var(--ink-2); }
.glyph-safe { color: var(--safe); } .glyph-review { color: var(--review); } .glyph-keep { color: var(--keep); }
.hex { color: var(--agent-fill); }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 14px; font-weight: 550; font-size: 13px;
  background: var(--card); box-shadow: inset 0 0 0 .5px var(--line-strong), 0 .5px 1px rgba(0,0,0,.08); white-space: nowrap; }
.btn:hover { background: var(--ink-1); }
.btn.pri { background: var(--accent); color: var(--on-accent); box-shadow: 0 1px 2px rgba(26,77,219,.3), inset 0 1px 0 rgba(255,255,255,.18); }
.btn.pri:hover { background: var(--accent-hover); }
.btn.pri[disabled] { opacity: .45; }
.btn.lg { height: 36px; padding: 0 18px; border-radius: 18px; font-size: 14px; }
.btn.ghost { background: transparent; box-shadow: none; color: var(--ink-6); }
.btn.ghost:hover { background: var(--line-soft); }
.btn .k { font: 11px var(--mono); opacity: .7; }
.ibtn { width: 30px; height: 30px; border-radius: 15px; display: inline-grid; place-items: center; color: var(--ink-6); }
.ibtn:hover { background: var(--line-soft); }
.ibtn .i { width: 17px; height: 17px; }
kbd { font: 10.5px var(--mono); padding: 1px 5px; border-radius: 4px; background: var(--ink-2); color: var(--ink-5); box-shadow: inset 0 -1px 0 var(--line-strong); }

/* ---------- Window chrome ---------- */
.win { position: relative; border-radius: 22px; background: var(--win); backdrop-filter: blur(40px) saturate(1.6); -webkit-backdrop-filter: blur(40px) saturate(1.6);
  box-shadow: var(--shadow-win); overflow: hidden; }
.lights { display: flex; gap: 8px; padding: 0 4px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.15); }
.lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }

/* Main window */
.main { width: 1180px; height: 760px; display: grid; grid-template-columns: 228px 1fr 300px; }
.main.noinsp { grid-template-columns: 228px 1fr 0; }
.side { position: relative; margin: 8px 0 8px 8px; border-radius: 16px; background: var(--side); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
  box-shadow: inset 0 0 0 .5px var(--glass-rim), 0 0 0 .5px var(--line); padding: 46px 8px 10px; overflow: auto; display: flex; flex-direction: column; }
.side .lights { position: absolute; top: 15px; left: 14px; }
.side h6 { margin: 14px 10px 4px; font-size: 11px; font-weight: 600; color: var(--ink-5); }
.nav { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: 8px; width: 100%; text-align: left; }
.nav .ai { --s: 20px; }
.nav .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav .n { font: 11.5px var(--mono); color: var(--ink-5); }
.nav:hover { background: var(--line-soft); }
.nav.on { background: var(--accent-soft); } .nav.on .t { font-weight: 600; } html[data-theme="dark"] .nav.on { background: rgba(101,148,250,.18); }
.nav .i { width: 17px; height: 17px; color: var(--ink-6); }
.side .foot { margin-top: auto; padding: 10px 8px 2px; border-top: .5px solid var(--line); display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-5); }

.center { display: flex; flex-direction: column; min-width: 0; position: relative; }
.tb { height: 54px; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 14px; flex: none; }
.tb .ttl { display: flex; flex-direction: column; line-height: 1.15; margin-right: auto; min-width: 0; }
.tb .ttl b { font-size: 15px; font-weight: 700; }
.tb .ttl span { font-size: 11.5px; color: var(--ink-5); white-space: nowrap; font-variant-numeric: tabular-nums; }
.cap { display: inline-flex; align-items: center; height: 32px; border-radius: 16px; padding: 0 2px; }
.cap .ibtn { width: 32px; height: 28px; border-radius: 14px; }
.seg { display: inline-flex; padding: 2px; gap: 2px; }
.seg button { height: 26px; padding: 0 10px; border-radius: 13px; font-size: 12px; font-weight: 550; color: var(--ink-6); display: inline-flex; align-items: center; gap: 5px; }
.seg button.on { background: var(--card); box-shadow: 0 1px 2px rgba(0,0,0,.12), inset 0 0 0 .5px var(--line); color: var(--ink-7); }
html[data-theme="dark"] .seg button.on { background: rgba(255,255,255,.14); }
.search { width: 150px; padding: 0 10px; gap: 6px; color: var(--ink-5); }
.search input { border: 0; outline: 0; background: none; width: 100%; font-size: 13px; color: var(--ink-7); }
.livecap { white-space: nowrap; flex: none; gap: 7px; padding: 0 12px 0 9px; color: var(--agent); font-weight: 600; font-size: 12px; background: var(--agent-soft); box-shadow: inset 0 0 0 .5px var(--agent-line); }
.livecap .i { width: 16px; height: 16px; color: var(--agent-fill); }
.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; transform: scale(.86); } }

.scroll { flex: 1; overflow: auto; padding: 0 18px 90px; }
.hero { display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; padding: 4px 2px 14px; }
.reclaim .lbl { font-size: 12px; color: var(--ink-5); font-weight: 550; }
.reclaim .big { font: 700 34px/1.05 var(--font); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.reclaim .big small { font-size: 18px; font-weight: 600; color: var(--ink-5); margin-left: 3px; }
.reclaim .chips { display: flex; gap: 6px; margin-top: 7px; }
.diskbar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--bar-track); gap: 1.5px; }
.diskbar > i { display: block; height: 100%; transition: flex-basis .6s cubic-bezier(.2,.8,.2,1); }
.diskbar .s { background: var(--safe); } .diskbar .r { background: var(--review); } .diskbar .k { background: var(--keep); opacity: .55; }
.diskbar .o { background: var(--other); } .diskbar .f { background: transparent; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 7px; font-size: 11.5px; color: var(--ink-5); }
.legend span { display: inline-flex; align-items: center; gap: 4px; } .legend .i { width: 12px; height: 12px; }
.legend b { font: 600 11.5px var(--mono); color: var(--ink-6); }

.maphead { display: flex; align-items: center; gap: 8px; margin: 2px 2px 8px; font-size: 12px; font-weight: 600; color: var(--ink-5); }
.maphead .sp { flex: 1; }
.tmap { position: relative; height: 196px; border-radius: 14px; overflow: hidden; background: var(--line-soft); }
.tile { position: absolute; padding: 1.5px; }
.tile > div { position: relative; width: 100%; height: 100%; border-radius: 9px; padding: 8px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;
  box-shadow: inset 0 0 0 .5px var(--line); transition: box-shadow .15s, transform .15s; }
.tile.safe > div { background: var(--safe-tile); } .tile.review > div { background: var(--review-tile); }
.tile:hover > div { box-shadow: inset 0 0 0 1px var(--line-strong); }
.tile.sel > div { box-shadow: inset 0 0 0 2px var(--accent); }
.tile.foc > div { box-shadow: inset 0 0 0 2px var(--accent), 0 0 0 3px var(--accent-ring); }
.tile .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 4px; }
.tile .ai { --s: 30px; }
.tile .nm { font-size: 12px; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .sz { font: 600 12px var(--mono); color: var(--ink-6); }
.tile.xl .ai { --s: 40px; } .tile.xl .sz { font-size: 17px; color: var(--ink-7); } .tile.xl .nm { font-size: 13px; }
.tile .ck { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); }
.tile .ck .i { width: 11px; height: 11px; }
.tile .sg .i { width: 14px; height: 14px; }
.tile.tiny > div { padding: 4px; align-items: center; justify-content: center; } .tile.tiny .ai { --s: 20px; }

.lhead { display: flex; align-items: center; gap: 8px; margin: 18px 2px 6px; position: sticky; top: 0; z-index: 2; padding: 6px 0; background: var(--pane); }
.lhead .ai { --s: 20px; } .lhead b { font-size: 13px; } .lhead .tot { font: 600 12px var(--mono); color: var(--ink-5); margin-left: auto; }
.lhead .gsel { font-size: 12px; color: var(--accent); font-weight: 550; padding: 2px 6px; border-radius: 6px; } .lhead .gsel:hover { background: var(--accent-soft); }
.list { border-radius: 12px; background: var(--card); box-shadow: inset 0 0 0 .5px var(--line); }
.row { display: grid; grid-template-columns: 18px 30px minmax(0,1fr) 110px 70px 84px; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-top: .5px solid var(--line-soft); position: relative; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--line-soft); }
.row.foc { background: var(--accent-soft); } html[data-theme="dark"] .row.foc { background: rgba(101,148,250,.14); }
.row.dis { opacity: .62; }
.row .ai { --s: 30px; }
.row .t { min-width: 0; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.row .t b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; flex: 0 0 auto; max-width: 100%; }
.row .t span { color: var(--ink-5); font-size: 12px; overflow: hidden; text-overflow: ellipsis; flex: 1 1 0; min-width: 0; }
.row .t .hx { width: 14px; height: 14px; color: var(--agent-fill); flex: none; }
.row .t .lk { width: 13px; height: 13px; color: var(--ink-5); flex: none; }
.row .sz { font: 600 13px var(--mono); text-align: right; }
.row .bar { height: 6px; border-radius: 3px; background: var(--bar-track); overflow: hidden; } .row .bar i { display: block; height: 100%; border-radius: 3px; background: var(--ink-4); }
.row.sel .bar i { background: var(--accent); }
.row.new { animation: newrow 1.6s ease-out; } .row.new::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--agent-fill); }
@keyframes newrow { from { background: var(--agent-soft); transform: translateY(-6px); opacity: 0; } 20% { opacity: 1; transform: none; } }
.cb { width: 16px; height: 16px; border-radius: 4.5px; box-shadow: inset 0 0 0 1px var(--ink-4); display: grid; place-items: center; background: var(--card); }
.cb.on { background: var(--accent); box-shadow: none; color: var(--on-accent); } .cb .i { width: 11px; height: 11px; display: none; } .cb.on .i { display: block; }
.cb.x { opacity: .35; }

.livestrip { display: flex; align-items: center; gap: 10px; margin: 2px 0 12px; padding: 9px 12px; border-radius: 12px; background: var(--agent-soft); box-shadow: inset 0 0 0 .5px var(--agent-line); }
.livestrip > .i { width: 22px; height: 22px; color: var(--agent-fill); } .livestrip .t { flex: 1; min-width: 0; }
.livestrip .t b { display: block; font-size: 12.5px; color: var(--agent); } .livestrip .t span { font-size: 12px; color: var(--ink-6); }
/* Inspector */
.insp { margin: 8px 8px 8px 0; border-radius: 16px; background: var(--pane); box-shadow: inset 0 0 0 .5px var(--line); overflow: auto; padding: 18px 18px 90px; }
.main.noinsp .insp { display: none; }
.insp .hd { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
.insp .hd .ai { --s: 64px; }
.insp h2 { margin: 0; font-size: 18px; line-height: 1.2; letter-spacing: -.01em; }
.insp .bigsz { font: 700 28px/1 var(--mono); letter-spacing: -.02em; }
.insp .chips { display: flex; gap: 6px; flex-wrap: wrap; }
.insp p.why { margin: 12px 0 0; color: var(--ink-6); font-size: 13px; }
.card { margin-top: 14px; border-radius: 12px; background: var(--card); box-shadow: inset 0 0 0 .5px var(--line); padding: 10px 12px; }
.insp .card { background: var(--ink-1); }
.act { display: flex; gap: 10px; align-items: flex-start; }
.act .i { width: 20px; height: 20px; color: var(--ink-6); margin-top: 1px; }
.act b { display: block; font-size: 13px; } .act span { font-size: 12px; color: var(--ink-5); }

.path { display: flex; align-items: center; gap: 6px; font: 11.5px var(--mono); color: var(--ink-6); padding: 3px 0; }

/* Selection bar (floating Liquid Glass) */

.selbar .proj b { font: 600 12px var(--mono); color: var(--safe); }

/* Toast */

@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -8px); } 10%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }

/* ---------- Popover ---------- */

  background: var(--glass-strong); backdrop-filter: blur(40px) saturate(1.8); -webkit-backdrop-filter: blur(40px) saturate(1.8); }

.qt span { font-size: 11px; color: var(--ink-5); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agentrow { margin-top: 10px; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 14px; background: var(--agent-soft); box-shadow: inset 0 0 0 .5px var(--agent-line); width: 100%; text-align: left; }

.neutralrow .i { width: 18px; height: 18px; color: var(--ink-6); } .neutralrow b { font-size: 12.5px; } .neutralrow span { font-size: 11.5px; color: var(--ink-5); display: block; }

/* ---------- Sheet ---------- */

.ci .t em { font-style: normal; font-size: 11.5px; color: var(--ink-5); display: flex; align-items: center; gap: 4px; } .ci .t em .i { width: 12px; height: 12px; }

.spin { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--accent-soft); border-top-color: var(--accent); animation: spin .8s linear infinite; }

.scanring svg.r { width: 100%; height: 100%; transform: rotate(-90deg); }
.scanring .c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }

.mini-set { width: 360px; border-radius: 12px; background: var(--card); box-shadow: 0 8px 24px rgba(0,0,0,.12), inset 0 0 0 .5px var(--line); overflow: hidden; }

.mini-set .r:first-of-type { border-top: 0; }
.mini-set .r .ai { --s: 24px; } .mini-set .r .appic { width: 24px; height: 24px; }
.mini-set .r .sw { margin-left: auto; }
.sw { width: 32px; height: 19px; border-radius: 10px; background: var(--ink-3); position: relative; flex: none; transition: background .25s; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .25s; }
.sw.on { background: var(--accent); } .sw.on::after { transform: translateX(13px); }

@keyframes swon { 0%, 35% { background: var(--ink-3); } 50%, 100% { background: var(--accent); } }
@keyframes swknob { 0%, 35% { transform: none; } 50%, 100% { transform: translateX(13px); } }
.cursor { position: absolute; width: 18px; height: 18px; animation: cur 2.4s ease-in-out infinite; }
@keyframes cur { 0% { transform: translate(40px, 40px); opacity: 0; } 30% { transform: translate(0, 0); opacity: 1; } 45% { transform: translate(0, 0) scale(.85); } 60%, 100% { transform: translate(0, 0); opacity: 1; } }
.flow { display: flex; align-items: center; gap: 14px; }

.cmdchip { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 6px 0 11px; border-radius: 9px; background: var(--ink-2); font: 12px var(--mono); }

.cmdchip .i { width: 13px; height: 13px; }

/* Notification banners */
.nstack { position: fixed; top: 40px; right: 14px; width: 372px; display: flex; flex-direction: column; gap: 10px; z-index: 40; }

  background: var(--glass-strong); backdrop-filter: blur(40px) saturate(1.8); -webkit-backdrop-filter: blur(40px) saturate(1.8); box-shadow: var(--shadow-pop), inset 0 1px 0 var(--spec), inset 0 0 0 .5px var(--glass-rim); }

.nside { position: fixed; left: 40px; top: 70px; width: 440px; z-index: 30; }
.nside h3 { margin: 0 0 6px; font-size: 18px; } .nside p { margin: 0 0 6px; color: var(--ink-6); font-size: 13px; }

.nside li { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--ink-6); } .nside li .i { width: 15px; height: 15px; color: var(--ink-5); margin-top: 1px; }
.panel { border-radius: 18px; padding: 16px 18px; }

/* Settings */

.set .tbar { display: flex; align-items: center; padding: 12px 14px 8px; gap: 6px; }

.set .tab { width: 82px; height: 50px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; color: var(--ink-6); }

.set .tab.on { background: rgba(127,127,127,.14); color: var(--accent); font-weight: 600; }
.set .pane { flex: 1; overflow: auto; padding: 4px 26px 24px; background: var(--pane); border-top: .5px solid var(--line); }
.fgroup { margin-top: 16px; } .fgroup > h5 { margin: 0 6px 6px; font-size: 12px; color: var(--ink-5); font-weight: 600; }

.frow .lab { flex: 1; min-width: 0; } .frow .lab small { display: block; color: var(--ink-5); font-size: 11.5px; }
.frow .val { color: var(--ink-5); font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
.popup { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 6px 0 10px; border-radius: 7px; background: var(--card); box-shadow: inset 0 0 0 .5px var(--line-strong), 0 .5px 1px rgba(0,0,0,.08); font-size: 12.5px; color: var(--ink-7); }
html[data-theme="dark"] .popup { background: var(--ink-3); }
.popup .i { width: 11px; height: 11px; color: var(--ink-5); }
.slider { width: 170px; height: 4px; border-radius: 2px; background: var(--ink-3); position: relative; } .slider i { position: absolute; left: 0; top: 0; bottom: 0; width: 22%; background: var(--accent); border-radius: 2px; }
.slider b { position: absolute; left: 22%; top: 50%; width: 16px; height: 16px; border-radius: 50%; background: #fff; transform: translate(-50%, -50%); box-shadow: 0 1px 3px rgba(0,0,0,.3), inset 0 0 0 .5px rgba(0,0,0,.1); }
.chipset { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; }
.pchip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 5px; border-radius: 9px; background: var(--ink-1); box-shadow: inset 0 0 0 .5px var(--line); font-size: 12px; }
.pchip .ai { --s: 20px; } .pchip .i { width: 14px; height: 14px; color: var(--ink-5); } .pchip code { font: 11.5px var(--mono); }
.status { display: flex; align-items: center; gap: 12px; padding: 12px; }
.status .ai { --s: 40px; } .status b { display: block; } .status span { font-size: 12px; color: var(--ink-5); }
.okchip { display: inline-flex; gap: 4px; align-items: center; color: var(--safe); font-weight: 600; font-size: 12px; } .okchip .i { width: 14px; height: 14px; }
.about { display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 30px; gap: 6px; }
.about .appic { width: 96px; height: 96px; } .about h3 { margin: 6px 0 0; font-size: 18px; } .about p { margin: 0; color: var(--ink-5); }

/* ---------- Prototype bar ---------- */
.proto { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; align-items: center; gap: 4px; padding: 5px; border-radius: 18px; max-width: calc(100vw - 24px); overflow-x: auto;
  background: rgba(20,22,28,.82); color: #e9ebef; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 10px 30px rgba(0,0,0,.3); font-size: 11.5px; }
.proto b { padding: 0 8px 0 6px; font-weight: 700; color: #9aa3b2; white-space: nowrap; }
.proto button { height: 26px; padding: 0 9px; border-radius: 13px; white-space: nowrap; color: #d6d9e0; }
.proto button:hover { background: rgba(255,255,255,.1); }
.proto button.on { background: #6594fa; color: #070d1a; font-weight: 600; }
.proto .sep { width: 1px; height: 18px; background: rgba(255,255,255,.18); margin: 0 4px; flex: none; }

/* Squarified treemap in a 1000×300 unit box, output in % */

    while (i < rest.length && worst([...row, rest[i]], scale, side) <= worst(row, scale, side)) row.push(rest[i++]);
    const s = row.reduce((a, o) => a + o.v * scale, 0);
    if (w >= h) { const cw = s / h; let cy = y; row.forEach(o => { const ch = o.v * scale / cw; out.push({ o, x, y: cy, w: cw, h: ch }); cy += ch; }); x += cw; w -= cw; }

    rest = rest.slice(row.length);
  }
  return out;
}

function startCleaning() {

}

/* ==========================================================================
   Router / render
   ========================================================================== */
function render() {
  const st = $("#stage"), ov = $("#overlay");
  let html = "", over = "";
  const sc = S.screen;
  if (["main", "live", "first-scan", "empty", "confirm", "cleaning", "done"].includes(sc)) {
    const mode = ["confirm", "cleaning", "done"].includes(sc) ? "main" : sc;
    html = `<div style="position:relative">${mainWin(mode)}${S.clean && ["confirm", "cleaning", "done"].includes(sc) ? `<div class="scrim" style="border-radius:22px">${sheet()}</div>` : ""}</div>`;
  } else if (sc.startsWith("onboarding")) html = onboarding();
  else if (sc === "settings") html = settings();
  else if (sc === "notifications") html = notifications();
  else html = "";
  st.innerHTML = html;
  if (S.pop || sc.startsWith("menubar")) over = popover(sc === "menubar-live");
  ov.innerHTML = over;
  $("#mbFree").textContent = sz(sc === "empty" ? FREE_AFTER : FREE0);
  $("#mbFr").classList.toggle("on", !!over);
  $("#mbFr").setAttribute("aria-expanded", !!over);
  document.querySelectorAll(".proto [data-go]").forEach(b => b.classList.toggle("on", b.dataset.go === sc || (sc.startsWith("onboarding") && b.dataset.go === "onboarding-1")));
  const fn = $("#freedNum"); if (fn && !fn.dataset.counted) { fn.dataset.counted = 1; countUp(fn); }
  if (S.qFocus) { const q = $("#q"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
}

function go(hash) {
  const [name, ...flags] = hash.replace(/^#/, "").split("&");
  flags.forEach(fl => { if (fl === "dark" || fl === "light") setTheme(fl); if (fl === "srcs") { S.srcs = true; document.body.classList.add("srcs"); } if (fl === "rm") document.documentElement.classList.add("rm"); });
  clearTimers();
  S.screen = name || "main"; S.pop = false; S.qFocus = false;
  if (S.screen.startsWith("onboarding")) S.onb = +(S.screen.split("-")[1] || 1);
  if (S.screen === "live") {
    S.live = []; S.liveDone = false; S.eco = "all"; S.src = "all"; S.focus = "docker-build";
    let i = 0;
    const add = () => { if (i >= LIVE_IDS.length) { S.liveDone = true; render(); return; } S.live.push(LIVE_IDS[i]); S.focus = LIVE_IDS[i]; i++; render(); S.timers.push(setTimeout(add, reduceMotion() ? 300 : 1500)); };
    S.timers.push(setTimeout(add, 600));
  }
  if (S.screen === "first-scan") {
    S.scanN = 0;
    const t = setInterval(() => { S.scanN++; render(); if (S.scanN >= SCAN_ORDER.length) clearInterval(t); }, reduceMotion() ? 120 : 420); S.timers.push(t);
  }
  if (S.screen === "confirm") { if (!S.clean || S.clean.phase !== "review" || !S.clean.fromUI) { S.sel = S.sel.size ? S.sel : DEFAULT_CONFIRM(); S.clean = { items: [...S.sel], phase: "review", state: {}, freed: 0 }; } S.clean.fromUI = false; }
  if (S.screen === "cleaning") { if (!S.clean || S.clean.phase !== "review") S.clean = { items: [...DEFAULT_CONFIRM()], phase: "review", state: {}, freed: 0 }; render(); startCleaning(); return; }
  if (S.screen === "done") {
    if (!S.clean || S.clean.phase !== "done") { const items = [...DEFAULT_CONFIRM()]; const state = {}; items.forEach(id => state[id] = id === "spotify" ? "skip" : "ok"); S.clean = { items, phase: "done", state, freed: 0 }; }
  }
  if (["main"].includes(S.screen) && S.clean && S.clean.phase !== "review") S.clean = null;
  render();
}
window.addEventListener("hashchange", () => go(location.hash));

/* ---------- theme ---------- */
let themePref = "auto";
function setTheme(t) {
  themePref = t;
  const dark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  document.querySelectorAll("[data-theme-set]").forEach(b => b.classList.toggle("on", b.dataset.themeSet === t));
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => themePref === "auto" && setTheme("auto"));

function toast(msg, icon = "i-check-circle") {
  const t = document.createElement("div"); t.className = "toast glass"; t.setAttribute("role", "status");
  t.innerHTML = `${use(icon)}${msg}`; document.body.appendChild(t); setTimeout(() => t.remove(), 2700);
}

function toggleSel(id) {
  const f = byId[id]; if (!f || !selectable(f)) return;
  S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id); render();
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-go],[data-act],[data-cb],[data-row],[data-tile],[data-eco],[data-src],[data-group],[data-gsel],[data-quick],[data-onb],[data-set],[data-theme-set],[data-unsel]");
  if (!t) { if (S.pop && !e.target.closest(".pop")) { S.pop = false; render(); } return; }
  const d = t.dataset;
  if (d.go) { e.preventDefault(); if (location.hash === "#" + d.go) go("#" + d.go); else location.hash = d.go; return; }
  if (d.themeSet) { setTheme(d.themeSet); return; }
  if (d.cb) { e.stopPropagation(); S.focus = d.cb; toggleSel(d.cb); return; }
  if (d.tile) { S.focus = d.tile; toggleSel(d.tile); return; }
  if (d.row) { S.focus = d.row; render(); return; }
  if (d.eco) { S.eco = d.eco; S.src = "all"; const v = visible(); if (v.length && !v.some(f => f.id === S.focus)) S.focus = v[0].id; render(); return; }
  if (d.src) { S.src = S.src === d.src ? "all" : d.src; S.eco = "all"; const v = visible(); if (v.length) S.focus = v[0].id; render(); return; }
  if (d.group) { S.group = d.group; render(); return; }
  if (d.gsel) { const items = visible().filter(f => f.eco === d.gsel && selectable(f)); const all = items.every(f => S.sel.has(f.id)); items.forEach(f => all ? S.sel.delete(f.id) : S.sel.add(f.id)); render(); return; }
  if (d.quick) { S.sel = new Set([d.quick]); S.clean = { items: [d.quick], phase: "review", state: {}, freed: 0, fromUI: true }; location.hash = "confirm"; return; }
  if (d.onb) { location.hash = "onboarding-" + d.onb; return; }
  if (d.set) { S.set = d.set; render(); return; }
  if (d.unsel) { S.clean.items = S.clean.items.filter(id => id !== d.unsel); S.sel.delete(d.unsel); render(); return; }
  switch (d.act) {
    case "pop": S.pop = !S.pop; if (S.screen.startsWith("menubar")) { location.hash = "main"; return; } render(); break;
    case "srcs": S.srcs = !S.srcs; document.body.classList.toggle("srcs", S.srcs); t.classList.toggle("on", S.srcs); break;
    case "rm": document.documentElement.classList.toggle("rm"); t.classList.toggle("on"); break;
    case "insp": S.insp = !S.insp; render(); break;
    case "clearsel": S.sel.clear(); render(); break;
    case "confirm": if (!S.sel.size) return; S.clean = { items: [...S.sel], phase: "review", state: {}, freed: 0, fromUI: true }; location.hash = "confirm"; break;
    case "confirm-from-notif": S.sel = new Set(["docker-build"]); S.clean = { items: ["docker-build"], phase: "review", state: {}, freed: 0, fromUI: true }; location.hash = "confirm"; break;
    case "popclean": S.sel = new Set(F.filter(f => f.cls === "safe").map(f => f.id)); S.clean = { items: [...S.sel], phase: "review", state: {}, freed: 0, fromUI: true }; location.hash = "confirm"; break;
    case "startclean": location.hash = "cleaning"; break;
    case "cancel": S.clean = null; location.hash = "main"; break;
    case "check": toast("Checking 46 known locations… (rules, no AI)", "i-refresh"); break;
    case "copyscan": e.preventDefault(); toast("Copied <span class='mono'>/freeroom:scan</span> — paste it into Claude Code", "i-terminal"); break;
    case "copy": e.preventDefault(); toast("Copied", "i-copy"); break;
    case "recheck": e.preventDefault(); toast("Still not detected — install it in Claude Code first", "i-info"); break;
    case "fda": S.fda = true; render(); break;
    case "reveal": e.preventDefault(); toast("Revealed in Finder", "i-folder"); break;
    case "history": toast("History: 214 GB freed since March", "i-history"); break;
    case "quit": toast("Quit (disabled in the mockup)", "i-power"); break;
  }
});
document.addEventListener("dblclick", e => { const t = e.target.closest("[data-tile]"); if (t) { S.focus = t.dataset.tile; S.insp = true; toggleSel(t.dataset.tile); } });
document.addEventListener("input", e => { if (e.target.id === "q") { S.q = e.target.value; S.qFocus = true; render(); } });
document.addEventListener("focusout", e => { if (e.target.id === "q") S.qFocus = false; });

/* Keyboard-first selection */
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") { if (e.key === "Escape") { e.target.blur(); S.qFocus = false; } return; }
  const sc = S.screen;
  if (e.key === "Escape") { if (S.pop) { S.pop = false; render(); } else if (sc === "confirm") { S.clean = null; location.hash = "main"; } return; }
  if (sc === "confirm" && e.key === "Enter") { e.preventDefault(); location.hash = "cleaning"; return; }
  if (sc === "done" && e.key === "Enter") { e.preventDefault(); location.hash = "empty"; return; }
  if (!["main", "live"].includes(sc)) return;
  const v = visible(), i = v.findIndex(f => f.id === S.focus);
  if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); S.focus = v[Math.min(v.length - 1, i + 1)].id; render(); scrollFocus(); }
  else if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); S.focus = v[Math.max(0, i - 1)].id; render(); scrollFocus(); }
  else if (e.key === " ") { e.preventDefault(); toggleSel(S.focus); }
  else if ((e.metaKey || e.ctrlKey) && e.key === "a") { e.preventDefault(); v.filter(f => f.cls === "safe").forEach(f => S.sel.add(f.id)); render(); }
  else if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); if (S.sel.size) { S.clean = { items: [...S.sel], phase: "review", state: {}, freed: 0, fromUI: true }; location.hash = "confirm"; } }
  else if (e.key === "/") { e.preventDefault(); const q = $("#q"); q && q.focus(); }
});
function scrollFocus() { const r = document.querySelector(".row.foc"); r && r.scrollIntoView({ block: "nearest" }); }

/* boot */
setTheme("auto");
preloadBrands();
document.querySelector('[data-act="srcs"]').classList.toggle("on", false);
go(location.hash || "#main");
</script>
