name: site

# freeroom.hblabs.co (site/). Every change to site/ is tested; a tag `site/vX.Y.Z` also builds the
# image and publishes it to GHCR as ghcr.io/hblabs-co/freeroom-site:X.Y.Z. The cluster picks new
# versions up by itself (see site/deploy/README.md); this workflow holds no cluster or registry secret.

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
    tags: ["site/v*"]
  pull_request:
    paths: ["site/**", ".github/workflows/site.yml"]

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: site

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: site/go.mod
          cache-dependency-path: site/go.sum
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go mod tidy is clean
        run: go mod tidy -diff
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 -covermode=atomic -coverprofile=cover.out ./...
      - name: coverage
        run: |
          pct="$(go tool cover -func=cover.out | awk '/^total:/ {sub("%","",$3); print $3}')"
          echo "### site: ${pct}% of statements covered" >> "$GITHUB_STEP_SUMMARY"

  image:
    needs: test
    if: startsWith(github.ref, 'refs/tags/site/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: version from the tag
        id: v
        run: |
          version="${GITHUB_REF_NAME#site/v}"
          if [ "$version" != "$(cat VERSION)" ]; then
            echo "tag says $version but site/VERSION says $(cat VERSION)"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: site
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/hblabs-co/freeroom-site:${{ steps.v.outputs.version }}
          build-args: |
            BUILD_VERSION=${{ steps.v.outputs.version }}
            BUILD_TIME=${{ steps.v.outputs.time }}
          labels: |
            org.opencontainers.image.source=https://github.com/hblabs-co/freeroom
            org.opencontainers.image.description=freeroom.hblabs.co
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
