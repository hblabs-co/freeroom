# Signed, notarized release: push a tag "vX.Y.Z" (matching Sources/FreeroomCore/Version.swift).
# Builds, signs with the HB Labs SAS Developer ID, notarizes, staples, publishes the GitHub
# release with the DMG and updates the cask in hblabs-co/homebrew-tap.
#
# "Run workflow" (manual) does everything except publishing: the DMG is kept as a build artifact.
#
# Credentials are organization secrets of hblabs-co, shared by every HB Labs app (see RELEASING.md).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        run: |
          VERSION=$(sed -n 's/.*version = "\(.*\)".*/\1/p' Sources/FreeroomCore/Version.swift)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "$PUBLISH" = "true" ] && [ "${GITHUB_REF_NAME}" != "v$VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Version.swift ($VERSION)"; exit 1
          fi

      - name: Test
        run: swift test

      - name: Import signing certificate and notary key
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" \
            || { echo "::error::No Developer ID Application identity in APPLE_DEVELOPER_ID_P12"; exit 1; }
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, staple
        env:
          FREEROOM_SIGN_IDENTITY: ${{ vars.APPLE_SIGN_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: scripts/release.sh

      - name: Keep the DMG (manual runs)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Freeroom-${{ env.VERSION }}
          path: |
            build/Freeroom-${{ env.VERSION }}.dmg
            build/freeroom.rb

      - name: Publish GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/v$VERSION.md"
          if [ -f "$NOTES" ]; then set -- --notes-file "$NOTES"; else set -- --generate-notes; fi
          gh release create "v$VERSION" "build/Freeroom-$VERSION.dmg" --title "Freeroom $VERSION" --verify-tag "$@"

      - name: Update Homebrew cask
        if: env.PUBLISH == 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/hblabs-co/homebrew-tap.git" "$RUNNER_TEMP/tap"
          cp build/freeroom.rb "$RUNNER_TEMP/tap/Casks/freeroom.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/freeroom.rb
          git diff --cached --quiet && { echo "Cask unchanged"; exit 0; }
          git commit -m "freeroom $VERSION"
          git push

      - name: Remove credentials
        if: always()
        run: |
          [ -n "${SIGNING_KEYCHAIN:-}" ] && security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"
